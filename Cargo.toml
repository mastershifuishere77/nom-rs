[package]
name = "nom-rs"
version = "0.0.1"
edition = "2021"
authors = ["mastershifuishere77"]
description = "nom-rs: nix-output-monitor rewritten in Rust"
homepage = "https://github.com/mastershifuishere77/nom-rs"
repository = "https://github.com/mastershifuishere77/nom-rs"
license = "MIT"

[lib]
name = "nix_output_monitor"
path = "src/lib.rs"

[[bin]]
name = "nom-rs"
path = "src/main.rs"

[[bin]]
name = "nom"
path = "src/bin/nom.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossterm = "0.28"
terminal_size = "0.4"
unicode-width = "0.2"
notify = "6.1"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
fd-lock = "4.0"
regex = "1.10"
crossbeam-channel = "0.5"
ctrlc = "3.4"
memchr = "2.7"

[dev-dependencies]
tempfile = "3"
